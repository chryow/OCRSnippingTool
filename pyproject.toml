[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-snipping-tool"
version = "1.3.1"
description = "Snipping Tool that extracts multilingual text from your screen using Hybrid AI/ML OCR."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "rapidocr>=3.0.0",
    "onnxruntime>=1.18.0",
    "mss>=9.0.0",
    "pynput>=1.7.6",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
ocr-snip = "ocr_snip.__main__:main"

[tool.setuptools.packages.find]
include = ["ocr_snip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
